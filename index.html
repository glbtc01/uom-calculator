<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>UOM Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Dark Mode Toggle -->
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
  <span class="toggle-icon" id="themeIcon">🌙</span>
  <div class="toggle-track"><div class="toggle-knob"></div></div>
</button>

<div class="page">
  <h1 class="page-title">UOM Calculator</h1>

  <!-- Card 1: Conversion Setup -->
  <div class="card">
    <div class="card-label">Conversion Setup</div>
    <div class="conv-grid">
      <input type="number" id="fromVal" min="0" step="any" inputmode="decimal" placeholder="From qty" />
      <div class="conv-equals">&nbsp;</div>
      <select id="fromUom"></select>
      <span class="pipe-sep">|</span>
      <input type="number" id="toVal" min="0" step="any" inputmode="decimal" placeholder="To qty" />
      <div class="conv-equals">&nbsp;</div>
      <select id="toUom"></select>
    </div>
    <div class="ratio-hint" id="ratioHint"></div>
  </div>

  <!-- Card 2: Customer Quantity -->
  <div class="card">
    <div class="card-label">Customer Quantity</div>
    <div class="qty-grid">
      <input type="number" id="custQty" placeholder="Enter quantity" step="any" inputmode="decimal" />
      <div class="uom-fixed-tag" id="custUomTag">—</div>
    </div>
  </div>

  <!-- Card 3: Result -->
  <div class="card">
    <div class="card-label">Result</div>
    <div class="result-line" id="resultLine">
      <span class="r-empty">Enter a quantity above to see the result</span>
    </div>
    <div class="warn-box" id="warnBox">
      <span class="warn-icon">⚠️</span>
      <span>Not evenly divisible — result may produce partial packaging</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn" onclick="openManage()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      Manage Units
    </button>
    <button class="btn btn-clear" onclick="clearAll()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      Clear
    </button>
  </div>

  <!-- Footer -->
  <p class="footer-copy">© AGB</p>
</div>

<!-- Manage Units Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-drag-handle"></div>
    <div class="modal-title">Manage Units</div>
    <div class="uom-list-wrap">
      <div class="uom-sortable" id="uomGrid"></div>
    </div>
    <div class="modal-add-row">
      <input type="text" id="newUomInput" placeholder="New unit (e.g. Pallet, ml, sqft)" />
      <button class="btn primary" onclick="addUnit()">Add</button>
    </div>
    <div class="modal-footer">
      <button class="btn primary" onclick="closeManage()">Done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
